[package]
name = "sim-codec-compare"
version = "0.1.2"
edition = "2024"
license = "MPL-2.0"
readme = "README.md"
description = "Developer harness comparing sim-codec-bitwise vs sim-codec-binary on size and speed."
repository = "https://github.com/sim-nest/sim-codecs"
homepage = "https://github.com/sim-nest/sim-codecs"
publish = false

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-value = { version = "0.2.0" }
sim-codec-binary = { version = "0.2.0", path = "../sim-codec-binary" }
sim-codec-bitwise = { version = "0.1.4", path = "../sim-codec-bitwise" }

[dev-dependencies]
sim-codec-algol = { version = "0.1.4", path = "../sim-codec-algol" }
sim-codec = { version = "0.1.8", path = "../sim-codec" }
sim-codec-json = { version = "0.2.2", path = "../sim-codec-json" }
sim-codec-lisp = { version = "0.2.1", path = "../sim-codec-lisp" }
sim-kernel = { version = "0.2.0", features = ["test-support"] }
sim-test-support = { version = "0.1.2", path = "../sim-test-support" }

[[bin]]
name = "report"
path = "src/bin/report.rs"

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }
