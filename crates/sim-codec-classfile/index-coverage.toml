schema = "sim.classfile-index-coverage/v1"

[coverage]
opcode_manifest = "opcode-manifest.tsv"
constant_source = "src/constant.rs"
constant_enum = "Constant"
attribute_source = "src/attribute.rs"
attribute_function = "standard_attribute_min_major"

[guards]
owner_crate = "sim-codec-classfile"
generated_files = [
  "CLASSFILE_COVERAGE.md",
  "OPCODES.md",
  "src/opcode_generated.rs",
]
