[package]
name = "sim-codec-index-vault"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Pure v2 Markdown bundle codec for complete SIM Index vault projections."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-codecs"
homepage = "https://github.com/sim-nest/sim-codecs"

[package.metadata.sim-recipes]
policy = "rustdoc"
reason = "The pure bundle codec is taught by its crate-level example and conformance fixtures."

[dependencies]
sha2 = "0.10"
sim-codec-doc = { version = "0.2.0", path = "../sim-codec-doc" }
sim-codec-index = { version = "0.2.2", path = "../sim-codec-index" }
sim-index-core = { version = "0.3.0" }
sim-index-vault-core = { version = "0.1.0" }
sim-kernel = { version = "0.3.0" }

[lints]
workspace = true
