[package]
name = "sim-codec-json"
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
description = "SIM workspace package for sim codec json."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-codecs"
homepage = "https://github.com/sim-nest/sim-codecs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sim-codec = { version = "0.3.0", path = "../sim-codec" }
sim-codec-binary-base64 = { version = "0.3.0", path = "../sim-codec-binary-base64" }
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-shape = { version = "0.4.0" }

[dev-dependencies]
sim-codec-lisp = { version = "0.4.0", path = "../sim-codec-lisp" }
sim-test-support = { version = "0.1.1", path = "../sim-test-support" }

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }
