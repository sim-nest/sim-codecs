[package]
name = "sim-codec-algol"
version = "0.1.4"
edition = "2024"
license = "MPL-2.0"
description = "SIM workspace package for sim codec algol."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-codecs"
homepage = "https://github.com/sim-nest/sim-codecs"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-codec = { version = "0.1.8", path = "../sim-codec" }
sim-codec-pratt = { version = "0.1.3", path = "../sim-codec-pratt" }
sim-codec-lisp = { version = "0.2.1", path = "../sim-codec-lisp" }
sim-kernel = { version = "0.2.0" }
sim-shape = { version = "0.2.1" }

[dev-dependencies]
sim-test-support = { version = "0.1.1", path = "../sim-test-support" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }
