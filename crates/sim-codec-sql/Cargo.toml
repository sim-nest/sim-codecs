[package]
name = "sim-codec-sql"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Bounded SQL projection for admitted SIM relational plans and migrations."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-codecs"
homepage = "https://github.com/sim-nest/sim-codecs"

[package.metadata.sim-recipes]
policy = "rustdoc"
reason = "SQL safety and dialect behavior are taught by checked rustdoc and conformance fixtures."

[dependencies]
sim-kernel = { version = "0.2.1" }
sim-relation-core = { version = "0.1.0" }
sim-relation-schema = { version = "0.1.0" }
sim-relation-plan = { version = "0.1.0" }
sim-relation-migrate = { version = "0.1.0" }

[lints]
workspace = true
