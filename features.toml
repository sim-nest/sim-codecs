[[feature]]
id = "feature/sim-codecs/python-source-frontend"
title = "Bounded Python 3.14 source codec"
summary = "Tokenize and parse frozen Python 3.14.6 syntax, lower every admitted source form to stable python/* expressions, and round-trip general SIM expressions through bounded plain, located, and tree lanes."
owner = "crate/sim-codec-python"
audiences = ["code", "framework"]
guidance = "Use codec/python as the bounded source frontend for embedded, capability-scoped Python scripting, not as a CPython replacement. It provides layout, trivia, source origins, soft keywords, literals, f-strings, template strings, canonical expression encoding, and deterministic diagnostics. Parser coverage and direct-evaluation fidelity are independent; this codec never executes Python, imports CPython, or constructs bytecode, compiler IR, an optimizer, project graph, object model, or host-access fallback."
claims_anchors = [
  "anchor/crate/sim-codec-python",
  "anchor/runtime-lib/sim-codec-python/python-codec-lib",
]
claims_surfaces = [
  "syntax/python",
]
claims_specimens = [
  "spec-test/sim-codecs/crates/sim-codec-python/src/tests",
]
supports = [
  "feature/sim-codecs/codec",
  "feature/sim-codecs/pratt",
]

[[feature]]
id = "feature/sim-codecs/javascript-source-frontend"
title = "Bounded ECMAScript 2026 codec"
summary = "Tokenize and structurally parse frozen ECMAScript 2026 Script and Module goals, lower every accepted form to stable javascript/* expressions, and round-trip through plain, located, and tree codec lanes."
owner = "crate/sim-codec-javascript"
audiences = ["code", "framework"]
guidance = "Use codec/javascript when JavaScript source needs bounded lexical goals, exact trivia and source origins, deterministic diagnostics, Script/Module distinction, canonical expression encoding, or public builders for a downstream syntax extension. Parser coverage and runtime-support markers are independent; this codec does not execute JavaScript or construct bytecode, control-flow IR, an optimizer, or a text-emission target."
claims_anchors = [
  "anchor/crate/sim-codec-javascript",
  "anchor/runtime-lib/sim-codec-javascript/javascript-codec-lib",
]
claims_surfaces = [
  "syntax/javascript",
]
claims_specimens = [
  "spec-test/sim-codecs/crates/sim-codec-javascript/tests/conformance",
]
supports = [
  "feature/sim-codecs/codec",
  "feature/sim-codecs/pratt",
]

