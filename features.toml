[[feature]]
id = "feature/sim-codecs/json-schema-2020-12"
title = "Bounded JSON Schema 2020-12 organ"
summary = "Retain, identify, compile, validate, diagnose, and conservatively adapt complete Draft 2020-12 schema documents without ambient resource access."
owner = "crate/sim-codec-json"
audiences = ["code", "framework"]
guidance = "Use SchemaDocument as the authoritative schema at JSON, MCP, skill HTTP, and OpenAI boundaries. Inject an explicit bounded retriever for external resources; never substitute Shape when shape_projection returns None."
claims_anchors = ["anchor/crate/sim-codec-json"]
claims_specimens = ["spec-test/sim-codecs/crates/sim-codec-json/src/schema_document/tests"]
supports = ["feature/sim-codecs/codec"]

[[feature]]
id = "feature/sim-codecs/mcp-schema-oracle"
title = "Dated MCP schema coverage oracle"
summary = "Own the final MCP 2026-07-28 and delivered 2025-03-26 wire profiles, typed metadata and messages, extension negotiation, full JSON Schema values, header projection, cache policy, and exhaustive schema coverage."
owner = "crate/sim-codec-mcp"
audiences = ["code", "framework"]
guidance = "Use sim-codec-mcp as the sole transport-independent MCP wire authority. Extend its checked method registry and one-to-one coverage ledger when MCP behavior evolves; preserve full SchemaDocument and semantic extension JSON, and derive rather than reinterpret headers."
claims_anchors = ["anchor/crate/sim-codec-mcp"]
claims_specimens = [
  "spec-test/sim-codecs/crates/sim-codec-mcp/tests/schema_oracle",
  "spec-test/sim-codecs/crates/sim-codec-mcp/src/wire_authority/tests",
]
supports = ["feature/sim-codecs/codec"]

[[feature]]
id = "feature/sim-codecs/wasm-abi-contract"
title = "Pure wasm ABI contract"
summary = "Describe wasm manifests, byte frames, imports, and exports without observing the host that carries them."
owner = "crate/sim-wasm-abi"
audiences = ["code", "framework"]
guidance = "Pass admitted module bytes to load_wasm_lib_from_bytes through the platform-selected LoaderPort. Treat audio import and export names as declarations only; perform loader, mount, clock, and audio work through platform and audio ports. The ABI crate never reads paths, chooses devices, samples clocks, or adds a codec-specific host API."
claims_anchors = ["anchor/crate/sim-wasm-abi", "anchor/runtime-lib/sim-wasm-abi/wasm-lib"]
claims_specimens = ["spec-test/sim-codecs/crates/sim-wasm-abi/src/tests/roundtrip", "spec-test/sim-codecs/crates/sim-codec-compare/src/platform_roundtrip_tests"]
supports = ["feature/sim-codecs/codec"]

[[feature]]
id = "feature/sim-codecs/openai-provider-wires"
title = "Canonical OpenAI chat and Responses wires"
summary = "Project one bounded canonical model contract through the explicit OpenAI Chat Completions and Responses request, response, and SSE wire families."
owner = "crate/sim-codec-chat"
audiences = ["code", "framework"]
guidance = "Select openai_profile for Chat Completions compatibility or openai_responses_profile for the native Responses input/output protocol. Both decode to the same canonical ModelResponse; Responses reasoning payloads remain provider-private."
claims_anchors = [
  "anchor/crate/sim-codec-chat",
  "anchor/runtime-lib/sim-codec-chat/open-ai-codec-lib",
]
claims_specimens = [
  "spec-test/sim-codecs/crates/sim-codec-chat/src/tests/openai_responses",
]
supports = ["feature/sim-codecs/codec"]

[[feature]]
id = "feature/sim-codecs/classfile-inspection"
title = "JVM-free classfile inspection"
summary = "Decode and re-encode retained JVM classfiles while browsing bounded constants, attributes, and byte-located instructions without starting a JVM."
owner = "crate/sim-codec-classfile"
audiences = ["code", "framework"]
guidance = "Use codec/classfile to inspect or preserve classfile structure as inert data. Instruction browse rows carry absolute byte offsets back into retained bytes; execution, linking, verification, and JVM startup are deliberately outside this codec."
claims_anchors = [
  "anchor/crate/sim-codec-classfile",
  "anchor/runtime-lib/sim-codec-classfile/classfile-codec-lib",
]
claims_specimens = [
  "recipe/sim-codecs/crates/sim-codec-classfile/01-inspection/retained-classfile",
  "spec-test/sim-codecs/crates/sim-codec-classfile/tests/index_coverage",
]
supports = [
  "feature/sim-codecs/codec",
]

